<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Минимальный тест КЦ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Минимальный тест КЦ</h1>

<div class="card">
  <button onclick="testRenderKc()">Тест renderKc()</button>
  <div id="log" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 8px; max-height: 400px; overflow-y: auto;"></div>
</div>

<script src="script.js"></script>
<script>
function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function testRenderKc() {
  document.getElementById('log').textContent = '';
  
  // Переключаемся на ВАТС (для включения чекбокса КЦ)
  product = 'vats';
  init();
  
  // Имитируем нажатие чекбокса
  $('addKc').checked = true;
  
  log('=== Перед renderKc ===');
  log('product: ' + product);
  log('addKc.checked: ' + $('addKc').checked);
  log('kcState.selected: ' + JSON.stringify(kcState.selected));
  log('kcState.qty: ' + JSON.stringify(kcState.qty));
  
  log('\n=== Проверка DEFAULT_KC_FEATURES ===');
  log('DEFAULT_KC_FEATURES: ' + JSON.stringify(DEFAULT_KC_FEATURES));
  
  log('\n=== Проверка DATA.kc.rows ===');
  DATA.kc.rows.forEach((r, i) => {
    if (i < 3 || r.parameter === 'Доп.лицензия') {
      log(`[${i}] "${r.parameter}"`);
    }
  });
  
  log('\n=== Вызываем renderKc() ===');
  renderKc();
  
  log('\n=== После renderKc ===');
  log('kcState.selected: ' + JSON.stringify(kcState.selected));
  log('kcState.qty: ' + JSON.stringify(kcState.qty));
  
  log('\n=== Проверка DOM - input элементы ===');
  const inputs = document.querySelectorAll('input.qty[id^="kc-qty-"]');
  log('Найдено input.qty элементов: ' + inputs.length);
  inputs.forEach(inp => {
    log(`  ID: ${inp.id}, Value: ${inp.value}, Visible: ${inp.offsetHeight > 0}`);
  });
  
  log('\n=== Проверка таблицы КЦ ===');
  const kcBody = document.getElementById('kcBody');
  if (kcBody) {
    log('kcBody.rows.length: ' + kcBody.rows.length);
    for (let i = 0; i < kcBody.rows.length; i++) {
      const firstCell = kcBody.rows[i].cells[0];
      log(`  Строка ${i}: ${firstCell.textContent.substring(0, 50)}`);
      const inp = firstCell.querySelector('input.qty');
      if (inp) {
        log(`    Есть input: ID=${inp.id}, Value=${inp.value}`);
      }
    }
  } else {
    log('kcBody не найден!');
  }
  
  log('\n=== Проверка видимости ===');
  log('kcCard.hidden: ' + $('kcCard').hidden);
}
</script>
</body>
</html>
