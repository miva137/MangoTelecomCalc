<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отладка КЦ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Отладка КЦ лицензий</h1>
<div class="card">
  <button onclick="testKC()">Запустить тест</button>
  <div id="output" style="margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 8px;"></div>
</div>
<script src="script.js"></script>
<script>
function log(msg) {
  document.getElementById('output').textContent += msg + '\n';
}

function testKC() {
  document.getElementById('output').textContent = '';
  
  log('1. Переключаемся на КЦ');
  product = 'kc';
  init();
  log('   product = ' + product);
  
  log('\n2. Проверяем DATA.kc.rows:');
  DATA.kc.rows.forEach((r, i) => {
    log('   [' + i + '] ' + r.parameter);
  });
  
  log('\n3. Имитируем добавление "Доп.лицензия":');
  const text = 'Доп.лицензия'.toLowerCase();
  const idx = DATA.kc.rows.findIndex((r, i) => i > 0 && r.parameter.toLowerCase() === text);
  log('   Найден индекс: ' + idx);
  log('   DATA.kc.rows[' + idx + '].parameter = ' + DATA.kc.rows[idx].parameter);
  
  if (idx >= 0) {
    kcState.selected.push(idx);
    kcState.licenseQty = 1;
    log('   Добавлено в kcState.selected');
    log('   kcState.licenseQty = 1');
    
    log('\n4. Вызываем renderKc():');
    renderKc();
    
    const input = document.getElementById('kc-license-qty');
    log('   Input найден: ' + (input !== null));
    if (input) {
      log('   input.value = ' + input.value);
      log('   input.id = ' + input.id);
      log('   input.className = ' + input.className);
    }
  }
}
</script>
</body>
</html>
