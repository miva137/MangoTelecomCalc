<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отладка</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="card">
  <h2>Отладка КЦ</h2>
  <button onclick="debug()">Проверить</button>
  <pre id="output" style="background: #f5f5f5; padding: 10px; margin-top: 10px;"></pre>
</div>

<script src="script.js"></script>
<script>
function debug() {
  let output = '';
  
  output += '=== Проверка DATA.kc.rows ===\n';
  DATA.kc.rows.forEach((r, i) => {
    output += `[${i}] "${r.parameter}"\n`;
  });
  
  output += '\n=== Проверка DEFAULT_KC_FEATURES ===\n';
  output += 'DEFAULT_KC_FEATURES: ' + JSON.stringify(DEFAULT_KC_FEATURES) + '\n';
  
  output += '\n=== Переключение на КЦ и init ===\n';
  product = 'kc';
  init();
  
  output += 'product: ' + product + '\n';
  output += 'kcState.selected: ' + JSON.stringify(kcState.selected) + '\n';
  output += 'kcState.qty: ' + JSON.stringify(kcState.qty) + '\n';
  
  if (kcState.selected.length > 0) {
    kcState.selected.forEach(idx => {
      const r = DATA.kc.rows[idx];
      output += `\nСтрока ${idx}: "${r.parameter}"\n`;
      output += `  Это лицензия? ${r.parameter === 'Доп.лицензия'}\n`;
      output += `  Количество: ${kcState.qty[idx]}\n`;
    });
  }
  
  output += '\n=== Проверка DOM ===\n';
  const inputs = document.querySelectorAll('input.qty[id^="kc-qty-"]');
  output += `Найдено полей ввода: ${inputs.length}\n`;
  inputs.forEach(inp => {
    output += `  ID: ${inp.id}, Value: ${inp.value}\n`;
  });
  
  output += '\n=== Проверка таблицы КЦ ===\n';
  const kcBody = document.getElementById('kcBody');
  if (kcBody) {
    output += `Строк в таблице: ${kcBody.rows.length}\n`;
    Array.from(kcBody.rows).forEach((row, i) => {
      output += `  Строка ${i}: ${row.cells[0].textContent.substring(0, 50)}\n`;
    });
  }
  
  document.getElementById('output').textContent = output;
}
</script>
</body>
</html>
